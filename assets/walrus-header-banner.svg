<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e2a47" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#081422" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034b75"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="480" fill="#05070a"/>
  <rect width="1200" height="480" fill="url(#bgGlow)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <circle cx="600" cy="180" r="280" fill="url(#cyanHalo)"/>

  <!-- Top BlueIce Affiliation Pill -->
  <g transform="translate(600, 52)">
    <rect x="-210" y="-16" width="420" height="32" rx="16" fill="url(#badgeGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="-188" cy="0" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <text x="-174" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">BLUEICE OPEN SOURCE LABS</text>
    <text x="38" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.4)">•</text>
    <text x="56" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">https://blueice.one</text>
  </g>

  <!-- Central Shield Crest Icon -->
  <g transform="translate(600, 140)">
    <!-- Shield Aura -->
    <path d="M 0 -45 L 38 -25 L 38 20 C 38 48 0 68 0 68 C 0 68 -38 48 -38 20 L -38 -25 Z" fill="rgba(56, 189, 248, 0.12)" filter="url(#glow)"/>
    <!-- Outer Shield Border -->
    <path d="M 0 -45 L 38 -25 L 38 20 C 38 48 0 68 0 68 C 0 68 -38 48 -38 20 L -38 -25 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    <!-- Cybernetic Walrus Tusk & Radar Core -->
    <path d="M -14 -12 C -14 18 -6 32 -3 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 14 -12 C 14 18 6 32 3 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="7" fill="#38bdf8" filter="url(#softGlow)"/>
    <path d="M -22 -6 L -10 -6" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5"/>
    <path d="M 10 -6 L 22 -6" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5"/>
  </g>

  <!-- Main Headline Typography -->
  <text x="600" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">
    PROJECT WALRUS
  </text>

  <!-- Subheadline -->
  <text x="600" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The Independent AI Agent Security, Intelligence &amp; Engineering Control Platform
  </text>

  <!-- Strategic Tagline Highlighting Tool & Skill Scanning -->
  <g transform="translate(600, 332)">
    <rect x="-380" y="-15" width="760" height="30" rx="15" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      EVERY TOOL CALL SCANNED • EVERY SKILL AUDITED FOR VULNERABILITIES • 100% LOCAL-FIRST
    </text>
  </g>

  <!-- Feature Pillar Badges -->
  <g transform="translate(150, 400)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="42" rx="8" fill="#0b131e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#34d399"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Live OSV Dependency Scan</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="42" rx="8" fill="#0b131e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#38bdf8"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Unicode / Injection Defense</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(470, 0)">
      <rect width="210" height="42" rx="8" fill="#0b131e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#fbbf24"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Hardened Tool Sandbox</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(710, 0)">
      <rect width="190" height="42" rx="8" fill="#0b131e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#a78bfa"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">9 Specialist AI Personas</text>
    </g>
  </g>
</svg>
